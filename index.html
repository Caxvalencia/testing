<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Asistente IA</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg">
    <img src="https://i.ibb.co/bMvc7Zr6/Vibrant-Summer-Meadow-Watercolor.png" alt="">
    <img src="https://i.ibb.co/ZRH04pV3/Vibrant-Summer-Meadow-Watercolor-1.png" alt="">
    <img src="https://i.ibb.co/bMvc7Zr6/Vibrant-Summer-Meadow-Watercolor.png" alt="">
  </div>

  <button id="btn" class="glass" aria-label="Hablar">
    <svg class="mic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 1a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
      <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
      <line x1="12" y1="19" x2="12" y2="23"/>
      <line x1="8" y1="23" x2="16" y2="23"/>
    </svg>
    <span class="wave w1"></span>
    <span class="wave w2"></span>
    <span class="wave w3"></span>
  </button>

  <svg style="position:absolute;width:0;height:0">
    <filter id="frosted" primitiveUnits="objectBoundingBox">
      <feImage href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8/5+hHgAHggJ/PBQnYQAAAABJRU5ErkJggg==" x="0" y="0" width="1" height="1" result="map"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="0.02" result="blur"/>
      <feDisplacementMap id="disp" in="blur" in2="map" scale="1" xChannelSelector="R" yChannelSelector="G">
        <animate attributeName="scale" to="1.4" dur="0.3s" begin="btn.mouseover"  fill="freeze"/>
        <animate attributeName="scale" to="1" dur="0.3s" begin="btn.mouseout"   fill="freeze"/>
      </feDisplacementMap>
    </filter>
  </svg>

  <script src="dist/main.js"></script>
</body>
</html>
